<h1>Filtres</h1>

Dépréciée depuis ZAP 2.4.0, la fonctionnalité de filtrage, qui permettait de modifier certains messages HTTP envoyés/reçus via ZAP ou d’y accéder, a désormais été supprimée. Les mêmes opérations, et bien plus encore, peuvent être réalisées à l’aide de scripts et de l’extension Replacer.
